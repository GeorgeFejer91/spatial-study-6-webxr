[package]
name = "study6-control-relay"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Bounded opaque WebSocket relay for Spatial Study 6 control failover"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
